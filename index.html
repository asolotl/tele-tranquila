<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tele Tranquila</title>
<style>
  :root{
    --bg: #14202b;
    --card: #1f303f;
    --card-hover: #2a3f52;
    --cream: #f2ede3;
    --amber: #e8a33d;
    --muted: #8fa3b3;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--cream);
    font-family: "Segoe UI", Verdana, sans-serif;
    overflow:hidden;
  }

  /* ---------- Pantalla de grilla ---------- */
  #grid-screen{ padding: 4vh 4vw; height:100vh; }
  .eyebrow{
    color:var(--amber);
    letter-spacing:.2em;
    text-transform:uppercase;
    font-size:1.1vw;
    margin:0 0 .3em 0;
  }
  h1{
    margin:0 0 4vh 0;
    font-size:3vw;
    font-weight:600;
    color:var(--cream);
  }
  #grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2.2vw;
  }
  .card{
    background:var(--card);
    border-radius: 14px;
    overflow:hidden;
    cursor:pointer;
    outline: none;
    border: 3px solid transparent;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .card img{
    width:100%; display:block; aspect-ratio: 16/9; object-fit:cover;
    background:#000;
  }
  .card .title{
    padding: 1vw 1.1vw 1.3vw 1.1vw;
    font-size: 1.15vw;
    line-height:1.3;
    color:var(--cream);
  }
  .card:focus, .card.focused{
    border-color: var(--amber);
    background: var(--card-hover);
    transform: scale(1.045);
  }
  #hint{
    position:fixed; bottom: 3vh; left:4vw; right:4vw;
    color:var(--muted); font-size:1vw; text-align:center;
  }

  /* ---------- Pantalla de reproductor ---------- */
  #player-screen{
    display:none; position:fixed; inset:0; background:#000;
  }
  #player-screen iframe{ width:100%; height:100%; border:0; }
  #end-panel{
    display:none;
    position:absolute; inset:0;
    background: rgba(20,32,43,.96);
    flex-direction:column; align-items:center; justify-content:center;
    color:var(--cream);
  }
  #end-panel h2{ font-size:2.2vw; margin-bottom:.3em; }
  #end-panel p{ color:var(--muted); margin-top:0; }
  #back-btn{
    margin-top:2vh;
    background:var(--amber); color:#14202b; border:none;
    font-size:1.3vw; font-weight:600;
    padding: .8vh 2.5vw; border-radius: 999px; cursor:pointer;
  }
  #back-btn:focus{ outline:4px solid var(--cream); }
</style>
</head>
<body>

<div id="grid-screen">
  <p class="eyebrow">Tele Tranquila</p>
  <h1>Elegí un video</h1>
  <div id="grid"></div>
  <p id="hint">Flechas para moverte · Enter/OK para reproducir</p>
</div>

<div id="player-screen">
  <div id="player"></div>
  <div id="end-panel">
    <h2>Terminó el video</h2>
    <p>Nada más se va a reproducir solo.</p>
    <button id="back-btn">Volver a la lista</button>
  </div>
</div>

<script>
/* =========================================================
   ACÁ EDITÁS LA LISTA DE VIDEOS.
   "id" es el código que aparece en la URL de YouTube:
   https://www.youtube.com/watch?v=ESTE_ES_EL_ID
   ========================================================= */
const VIDEOS = [
  { id: "aqz-KE-bpKQ", title: "Big Buck Bunny (corto animado, ejemplo)" },
  { id: "LXb3EKWsInQ", title: "Costa Rica 4K (paisaje, ejemplo)" },
  { id: "ScMzIvxBSi4", title: "Sintel (corto animado, ejemplo)" },
  { id: "eRsGyueVLvQ", title: "Tears of Steel (corto, ejemplo)" },
];
// Reemplazá estos 4 por los videos reales que quieras cargar.
// El id es lo que va después de "watch?v=" en la URL de YouTube.

const grid = document.getElementById('grid');
const gridScreen = document.getElementById('grid-screen');
const playerScreen = document.getElementById('player-screen');
const endPanel = document.getElementById('end-panel');
const backBtn = document.getElementById('back-btn');
let player;
let focusIndex = 0;

VIDEOS.forEach((v, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.tabIndex = 0;
  card.dataset.index = i;
  card.innerHTML = `
    <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="">
    <div class="title">${v.title}</div>
  `;
  card.addEventListener('click', () => playVideo(v.id));
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') playVideo(v.id);
  });
  grid.appendChild(card);
});

function setFocus(i){
  const cards = document.querySelectorAll('.card');
  if (i < 0 || i >= cards.length) return;
  focusIndex = i;
  cards.forEach(c => c.classList.remove('focused'));
  cards[i].classList.add('focused');
  cards[i].focus();
}
setFocus(0);

const COLS = 4;
document.addEventListener('keydown', (e) => {
  if (gridScreen.style.display === 'none') return; // solo navegamos la grilla si está visible
  switch(e.key){
    case 'ArrowRight': setFocus(focusIndex + 1); break;
    case 'ArrowLeft':  setFocus(focusIndex - 1); break;
    case 'ArrowDown':  setFocus(focusIndex + COLS); break;
    case 'ArrowUp':    setFocus(focusIndex - COLS); break;
  }
});

/* ---------- Reproductor (YouTube IFrame API) ---------- */
let apiReady = false;
let pendingVideoId = null;

const tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

// La API llama a esta función global sola, cuando termina de cargar
window.onYouTubeIframeAPIReady = function () {
  apiReady = true;
  if (pendingVideoId) {
    createPlayer(pendingVideoId);
    pendingVideoId = null;
  }
};

function playVideo(id){
  gridScreen.style.display = 'none';
  playerScreen.style.display = 'block';
  endPanel.style.display = 'none';

  if (!apiReady) {
    // Todavía no cargó la librería de YouTube: guardamos el video y lo
    // reproducimos apenas esté lista (pasa sobre todo con internet lenta).
    pendingVideoId = id;
    return;
  }

  if (player) { player.loadVideoById(id); return; }
  createPlayer(id);
}

function createPlayer(id){
  player = new YT.Player('player', {
    videoId: id,
    playerVars: {
      autoplay: 1,
      controls: 1,
      rel: 0,            // no muestra videos "relacionados" de otros canales al final
      modestbranding: 1,
      fs: 1,
      iv_load_policy: 3, // sin anotaciones/tarjetas
      playsinline: 1
    },
    events: {
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.ENDED) {
          endPanel.style.display = 'flex';
        }
      }
    }
  });
}

function goBack(){
  playerScreen.style.display = 'none';
  gridScreen.style.display = 'block';
  endPanel.style.display = 'none';
  if (player && player.stopVideo) player.stopVideo();
  setFocus(focusIndex);
}

backBtn.addEventListener('click', goBack);
backBtn.addEventListener('keydown', e => { if (e.key === 'Enter') goBack(); });

// Botón "Volver" del control remoto (Tizen: keyCode 10009, navegadores: Backspace/Escape)
document.addEventListener('keydown', (e) => {
  if (playerScreen.style.display === 'block' &&
      (e.key === 'Backspace' || e.key === 'Escape' || e.keyCode === 10009)) {
    goBack();
  }
});
</script>
</body>
</html>
